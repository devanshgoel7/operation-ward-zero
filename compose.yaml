name: operation-ward-zero

services:
  db:
    image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    environment:
      POSTGRES_USER: wardzero
      POSTGRES_DB: wardzero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "wardzero", "-d", "wardzero"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      SIMULATOR_KEY: ${SIMULATOR_KEY:?Set SIMULATOR_KEY in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: wardzero
      POSTGRES_DB: wardzero
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 6

  simulator:
    build:
      context: .
      target: simulator
    environment:
      BUFFER_PATH: /data/frames.sqlite3
      INGEST_URL: http://app:8000/api/v1/readings
      SIMULATOR_KEY: ${SIMULATOR_KEY:?Set SIMULATOR_KEY in .env}
    volumes:
      - simulator_data:/data

volumes:
  simulator_data:
  postgres_data:
